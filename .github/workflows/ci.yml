name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            deps:
              - package.json
              - package-lock.json
            src:
              - 'client/src/**/*.ts'
              - 'client/src/**/*.tsx'
              - 'server/**/*.ts'
              - 'shared/**/*.ts'
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v5
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      
      # Only audit when deps change
      - name: Security audit
        if: steps.changed-files.outputs.deps_any_changed == 'true' || github.event_name == 'push'
        run: npm audit --audit-level=high --omit=dev
      
      # Lockfile integrity on dep changes
      - name: Verify lockfile integrity
        if: steps.changed-files.outputs.deps_any_changed == 'true'
        run: npm ci --ignore-scripts --dry-run
      
      # Format only changed files in PRs (use local binary)
      - name: Check formatting (changed files)
        if: steps.changed-files.outputs.src_any_changed == 'true' && github.event_name == 'pull_request'
        run: ./node_modules/.bin/prettier --check ${{ steps.changed-files.outputs.src_all_changed_files }}
      
      # Full format check on push to main
      - name: Check formatting (full)
        if: github.event_name == 'push'
        run: ./node_modules/.bin/prettier --check "client/src/**/*.{ts,tsx}" "server/**/*.ts" "shared/**/*.ts"
      
      # Lint only changed files in PRs
      - name: Lint (changed files)
        if: steps.changed-files.outputs.src_any_changed == 'true' && github.event_name == 'pull_request'
        run: ./node_modules/.bin/eslint ${{ steps.changed-files.outputs.src_all_changed_files }} --max-warnings 0
      
      # Full lint on push to main
      - name: Lint (full)
        if: github.event_name == 'push'
        run: ./node_modules/.bin/eslint client/src server shared --max-warnings 0
      
      - name: Type check
        run: npm run check
      
      - name: Run tests with coverage
        run: ./node_modules/.bin/vitest run --coverage
      
      - name: Check coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            OVERALL=$(node -p "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.statements.pct")
            echo "Overall coverage: $OVERALL%"
            
            # Minimum thresholds
            if [ $(node -p "$OVERALL < 3") = "true" ]; then
              echo "ERROR: Coverage below 3% baseline"
              exit 1
            fi
          fi

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
